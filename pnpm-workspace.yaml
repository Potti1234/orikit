packages:
  - "apps/*"
  - "packages/*"

shamefullyHoist: true

onlyBuiltDependencies:
  - "@biomejs/biome"
  - "@nativescript/core"
  - "@parcel/watcher"
  - "core-js-pure"
  - "esbuild"
  - "nativescript"
allowBuilds:
  '@nativescript/core': true
  '@parcel/watcher': true
  core-js-pure: true
  esbuild: true
  msgpackr-extract: true
  nativescript: true
minimumReleaseAgeExclude:
  - foldkit@0.134.0
